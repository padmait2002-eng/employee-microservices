# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=employee-microservices

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.employeemicroservices=DEBUG
logging.level.org.springframework.security=DEBUG

# Security Headers
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Jackson Configuration (for JSON serialization)
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 Database (in-memory) configuration
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security Configuration
spring.security.filter.order=5
